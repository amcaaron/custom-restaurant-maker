{% extends "base.html" %}

{% block title %}Admin Login{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">

        <div class="card shadow">
            <div class="card-header bg-dark text-white">
                <h3 class="mb-0">Admin Login</h3>
            </div>

            <div class="card-body">

                <form method="post" action="/login">

                    <div class="mb-3">
                        <label class="form-label">Username</label>

                        <input type="text"
                               name="username"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>

                        <input type="password"
                               name="password"
                               class="form-control"
                               required>
                    </div>

                    <button type="submit" class="btn btn-custom-orange w-100">
                        Login
                    </button>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
