{% extends "base.html" %}

{% block title %}Start Order{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8">

        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h2 class="mb-0">Start an Order</h2>
            </div>

            <div class="card-body">
                <form method="post" action="/start_order">

                    <h4 class="mb-3">Customer Type</h4>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input"
                               type="radio"
                               name="type"
                               value="new"
                               checked
                               onchange="toggleCustomerFields()">
                        <label class="form-check-label">New Customer</label>
                    </div>

                    <div class="form-check form-check-inline mb-4">
                        <input class="form-check-input"
                               type="radio"
                               name="type"
                               value="existing"
                               onchange="toggleCustomerFields()">
                        <label class="form-check-label">Existing Customer</label>
                    </div>

                    <hr>

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text"
                               name="name"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="text"
                               name="phone_number"
                               class="form-control">
                    </div>

                    <div id="new-customer-fields">

                        <div class="mb-3">
                            <label class="form-label">Street Address</label>
                            <input type="text"
                                   name="street_address"
                                   class="form-control">
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">City</label>
                                <input type="text"
                                       name="city"
                                       class="form-control">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">State</label>
                                <input type="text"
                                       name="state"
                                       class="form-control">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Zip Code</label>
                                <input type="text"
                                       name="zip_code"
                                       class="form-control">
                            </div>
                        </div>

                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success btn-lg">
                            Continue to Menu
                        </button>

                        <a href="/" class="btn btn-secondary btn-lg">
                            Back to Home
                        </a>
                    </div>

                </form>
            </div>
        </div>

    </div>
</div>

<script>
function toggleCustomerFields() {
    const customerType = document.querySelector('input[name="type"]:checked').value;
    const newCustomerFields = document.getElementById('new-customer-fields');

    if (customerType === 'existing') {
        newCustomerFields.style.display = 'none';
    } else {
        newCustomerFields.style.display = 'block';
    }
}

window.onload = toggleCustomerFields;
</script>

{% endblock %}
